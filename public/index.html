<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Home</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <!-- Applies the saved theme and palette before first paint, and adds the appearance picker -->
    <script src="js/theme.js"></script>
</head>
<body>
<header class="hero">
    <h1>Welcome to My Blog Project</h1>
    <p class="lead mb-4">Join us to share and explore amazing content!</p>
    <div id="authButtons"></div>
</header>

<main class="feed">
    <div class="feed-toolbar">
        <h2 class="feed-title">Latest posts</h2>
        <select id="sortSelect" class="sort-select" aria-label="Sort posts">
            <option value="new">Newest</option>
            <option value="top">Top rated</option>
            <option value="comments">Most commented</option>
        </select>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="searchInput" placeholder="Search posts or authors..." aria-label="Search posts" autocomplete="off">
        </div>
    </div>
    <p id="searchSummary" class="search-summary" hidden></p>
    <div id="postsContainer"></div>
    <div class="load-more-wrap">
        <button type="button" id="loadMoreBtn" class="load-more-btn" hidden>Load more posts</button>
        <div id="pageInfo" class="page-info"></div>
    </div>
</main>

<!-- Edit post dialog (replaces the old prompt() boxes) -->
<div id="editDialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle">
        <h3 id="editDialogTitle">Edit post</h3>
        <form id="editPostForm">
            <div class="form-group">
                <label for="editTitle">Title</label>
                <input type="text" id="editTitle" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="editContent">Content</label>
                <textarea id="editContent" class="form-control" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label>Image</label>
                <div class="edit-image">
                    <div id="editImagePreview"></div>
                    <div class="edit-image-actions">
                        <label for="editImageInput" class="btn-soft">Change image</label>
                        <input type="file" id="editImageInput" accept="image/*" hidden>
                        <button type="button" id="removeImageBtn" class="btn-soft danger">Remove image</button>
                        <span class="hint">JPG or PNG, up to 5MB.</span>
                    </div>
                </div>
            </div>
            <div id="editError" class="dialog-error"></div>
            <div class="dialog-actions">
                <button type="button" id="cancelEditBtn" class="btn btn-ghost">Cancel</button>
                <button type="submit" id="saveEditBtn" class="btn btn-brand">Save changes</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/common.js"></script>
<script src="js/notifications.js"></script>
<script>
    $(document).ready(function() {
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId'); // Retrieve the user ID from localStorage
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

        // Render a read-only 5-star display for a comment's rating (0/null renders nothing)
        function starsDisplay(rating) {
            if (!rating) return '';
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<span class="${i <= rating ? 'filled' : ''}">&#9733;</span>`;
            }
            return `<span class="comment-rating" title="${rating} out of 5">${stars}</span>`;
        }

        // Build the 5-button star picker used in the comment form
        function ratingPickerHtml() {
            let buttons = '';
            for (let i = 1; i <= 5; i++) {
                buttons += `<button type="button" class="star-btn" data-value="${i}" aria-label="Rate ${i} star${i > 1 ? 's' : ''}">&#9733;</button>`;
            }
            return `
                <div class="rating-row">
                    <span class="rating-label">Rating (optional):</span>
                    <div class="rating-picker">${buttons}</div>
                </div>
            `;
        }

        if (token) {
            // Show New Post and Logout buttons if logged in
            $('#authButtons').html(`
                <button id="newPostBtn" class="btn btn-light mx-1">+ New Post</button>
                <a href="${profileUrl(userId)}" class="btn btn-outline-light mx-1">My Profile</a>
                <a href="edit-profile.html" class="btn btn-outline-light mx-1">Edit Profile</a>
                <button id="logoutBtn" class="btn btn-outline-light mx-1">Logout</button>
            `);
        } else {
            // Show Register and Login buttons if not logged in
            $('#authButtons').html(`
                <a href="register.html" class="btn btn-light mx-1">Register</a>
                <a href="login.html" class="btn btn-outline-light mx-1">Login</a>
            `);
        }

        // Event handler for New Post button
        $('#authButtons').on('click', '#newPostBtn', function() {
            window.location.href = 'create-post.html';
        });

        // Event handler for Logout button
        $('#authButtons').on('click', '#logoutBtn', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            location.reload(); // Reload to update UI
        });

        // ------------------------------------------------------------------
        // Feed: search and pagination
        // ------------------------------------------------------------------
        const PAGE_SIZE = 5;
        // postId: set when opened through a shared link (index.html?post=ID) to show only that post
        const feed = { query: '', sort: 'new', postId: new URLSearchParams(location.search).get('post'), offset: 0, total: 0, requestId: 0 };
        const postsById = {}; // loaded posts, used by the share buttons

        function postHtml(post) {
            postsById[post.id] = post;
            const isOwner = post.author_id === Number(userId); // Ensure type-safe comparison
            return `
                <article class="card post-card my-4" data-post-id="${post.id}">
                    <div class="card-body">
                        <div class="post-head">
                            <a href="${profileUrl(post.author_id)}" class="avatar-link" title="View profile">${avatar(post.author, post.author_picture)}</a>
                            <div class="meta">
                                <a href="${profileUrl(post.author_id)}" class="post-author author-link">${highlight(post.author, feed.query)}</a>
                                <div class="post-date" title="${new Date(post.created_at).toLocaleString()}">${timeAgo(post.created_at)}</div>
                            </div>
                            ${isOwner ? `
                            <div class="post-actions">
                                <button class="btn btn-outline-secondary btn-sm editBtn">Edit</button>
                                <button class="btn btn-outline-danger btn-sm deleteBtn">Delete</button>
                            </div>` : ''}
                        </div>

                        <h5 class="card-title">${highlight(post.title, feed.query)}</h5>
                        <p class="card-text">${highlight(post.content, feed.query)}</p>
                        ${post.image_url ? `<img class="post-image" src="${esc(post.image_url)}" alt="">` : ''}

                        <div class="share-row">
                            <span class="share-label">Share:</span>
                            <a class="share-btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(postUrl(post.id))}">Facebook</a>
                            <button type="button" class="share-btn shareInstagramBtn">Instagram</button>
                            <button type="button" class="share-btn copyLinkBtn">Copy link</button>
                        </div>

                        <div class="comments-section" data-post-id="${post.id}">
                            <div class="comments-title">Comments <span class="count">0</span> <span class="avg"></span></div>
                            <div class="commentsList mb-2"><p class="comments-empty">Loading comments...</p></div>
                            ${token ? `
                            <form class="commentForm">
                                ${ratingPickerHtml()}
                                <input type="hidden" class="commentRatingInput" value="">
                                <div class="input-group">
                                    <input type="text" class="form-control commentInput" placeholder="Write a comment..." required>
                                    <div class="input-group-append">
                                        <button type="submit" class="btn">Comment</button>
                                    </div>
                                </div>
                            </form>` : `<p class="login-hint"><a href="login.html">Log in</a> to leave a comment.</p>`}
                        </div>
                    </div>
                </article>
            `;
        }

        function emptyStateHtml() {
            if (feed.postId) {
                return `
                    <div class="empty-state">
                        <p class="mb-0 mt-2">This post does not exist anymore. <a href="index.html">See all posts</a></p>
                    </div>
                `;
            }
            if (feed.query) {
                return `
                    <div class="empty-state">
                        <div class="icon">&#128269;</div>
                        <p class="mb-0 mt-2">No posts match &ldquo;${esc(feed.query)}&rdquo;. Try another word.</p>
                    </div>
                `;
            }
            return `
                <div class="empty-state">
                    <div class="icon">&#9998;</div>
                    <p class="mb-0 mt-2">No posts available yet. Be the first to write one!</p>
                </div>
            `;
        }

        function updateFeedFooter() {
            const hasMore = feed.offset < feed.total;
            $('#loadMoreBtn').prop('hidden', !hasMore).prop('disabled', false).text('Load more posts');
            $('#pageInfo').text(feed.total > 0 ? `Showing ${feed.offset} of ${feed.total} posts` : '');

            const summary = $('#searchSummary');
            if (feed.postId) {
                summary.html('Showing a single post. <a href="index.html">See all posts</a>').prop('hidden', false);
            } else if (feed.query) {
                summary.html(`<b>${feed.total}</b> result${feed.total === 1 ? '' : 's'} for &ldquo;${esc(feed.query)}&rdquo;
                    <a href="#" id="clearSearch">Clear search</a>`).prop('hidden', false);
            } else {
                summary.prop('hidden', true);
            }
        }

        // Load one page of posts; reset=true starts over (new search)
        function loadPosts(reset) {
            if (reset) feed.offset = 0;
            const requestId = ++feed.requestId;
            $('#loadMoreBtn').prop('disabled', true).text('Loading...');

            $.ajax({
                url: feed.postId ? `/api/posts/${encodeURIComponent(feed.postId)}` : '/api/posts',
                headers: headers,
                type: 'GET',
                data: feed.postId ? {} : { q: feed.query, sort: feed.sort, limit: PAGE_SIZE, offset: feed.offset },
                success: function(data, status, xhr) {
                    if (requestId !== feed.requestId) return; // a newer search already replaced this one
                    const posts = feed.postId ? [data] : data;
                    feed.total = feed.postId ? 1 : Number(xhr.getResponseHeader('X-Total-Count')) || 0;
                    if (reset) $('#postsContainer').empty();
                    if (reset && posts.length === 0) {
                        $('#postsContainer').html(emptyStateHtml());
                    }
                    posts.forEach(post => {
                        $('#postsContainer').append(postHtml(post));
                        loadComments(post.id);
                    });
                    feed.offset += posts.length;
                    updateFeedFooter();
                },
                error: function(err) {
                    console.error('Error fetching posts:', err);
                    if (feed.postId) {
                        $('#postsContainer').html(emptyStateHtml());
                        feed.total = 0;
                        updateFeedFooter();
                        return;
                    }
                    $('#loadMoreBtn').prop('disabled', false).text('Load more posts');
                }
            });
        }

        // Leave the single-post view (index.html?post=ID) when the user searches or sorts
        function showAllPosts() {
            if (!feed.postId) return;
            feed.postId = null;
            history.replaceState(null, '', 'index.html');
        }

        $('#sortSelect').on('change', function() {
            feed.sort = $(this).val();
            showAllPosts();
            loadPosts(true);
        });

        // ------------------------------------------------------------------
        // Share a post. Facebook is a plain share link. Instagram has no web share URL:
        // on phones the native share sheet (with the post image) lets you pick Instagram;
        // elsewhere the caption is copied and Instagram opens so it can be pasted.
        // ------------------------------------------------------------------
        function flash(button, text) {
            const original = button.text();
            button.text(text).prop('disabled', true);
            setTimeout(() => button.text(original).prop('disabled', false), 2500);
        }

        $('#postsContainer').on('click', '.copyLinkBtn', function() {
            const button = $(this);
            const postId = button.closest('.post-card').data('post-id');
            navigator.clipboard.writeText(postUrl(postId))
                .then(() => flash(button, 'Copied!'))
                .catch(() => prompt('Copy this link:', postUrl(postId)));
        });

        $('#postsContainer').on('click', '.shareInstagramBtn', async function() {
            const button = $(this);
            const post = postsById[button.closest('.post-card').data('post-id')];
            const caption = `${post.title}\n\n${post.content}\n\n${postUrl(post.id)}`;

            // Desktop share sheets (Windows/macOS) don't list Instagram, so only use it on touch devices
            if (navigator.share && matchMedia('(pointer: coarse)').matches) {
                try {
                    const shareData = { title: post.title, text: caption };
                    if (post.image_url) {
                        const blob = await (await fetch(post.image_url)).blob();
                        const file = new File([blob], post.image_url.split('/').pop(), { type: blob.type });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) shareData.files = [file];
                    }
                    await navigator.share(shareData);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return; // the user closed the share sheet
                }
            }

            try {
                await navigator.clipboard.writeText(caption);
                flash(button, 'Caption copied!');
            } catch (err) {
                prompt('Copy this caption for Instagram:', caption);
            }
            window.open('https://www.instagram.com/', '_blank', 'noopener');
        });

        $('#loadMoreBtn').on('click', function() {
            loadPosts(false);
        });

        // Search as the user types (debounced), Escape clears it
        let searchTimer;
        $('#searchInput').on('input', function() {
            clearTimeout(searchTimer);
            const value = $(this).val().trim();
            searchTimer = setTimeout(function() {
                if (value === feed.query) return;
                feed.query = value;
                showAllPosts();
                loadPosts(true);
            }, 300);
        }).on('keydown', function(e) {
            if (e.key === 'Escape') $(this).val('').trigger('input');
        });

        $('#searchSummary').on('click', '#clearSearch', function(e) {
            e.preventDefault();
            $('#searchInput').val('').trigger('input');
        });

        loadPosts(true);

        // Fetch and render comments for a given post
        function loadComments(postId) {
            $.ajax({
                url: `/api/posts/${postId}/comments`,
                type: 'GET',
                success: function(comments) {
                    const section = $(`.comments-section[data-post-id="${postId}"]`);
                    const list = section.find('.commentsList');
                    section.find('.comments-title .count').text(comments.length);
                    const ratings = comments.map(c => c.rating).filter(Boolean);
                    section.find('.comments-title .avg').html(ratingSummary({
                        avg_rating: ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null,
                        rating_count: ratings.length,
                    }));
                    if (comments.length === 0) {
                        list.html('<p class="comments-empty">No comments yet. Start the conversation!</p>');
                        return;
                    }
                    list.empty();
                    comments.forEach(comment => {
                        const isCommentOwner = comment.author_id === Number(userId);
                        list.append(`
                            <div class="comment" data-comment-id="${comment.id}">
                                <a href="${profileUrl(comment.author_id)}" class="avatar-link" title="View profile">${avatar(comment.author, comment.author_picture, 'sm')}</a>
                                <div class="comment-bubble">
                                    <div class="comment-top">
                                        <a href="${profileUrl(comment.author_id)}" class="comment-author author-link">${esc(comment.author)}</a>
                                        ${starsDisplay(comment.rating)}
                                        <span class="comment-time" title="${new Date(comment.created_at).toLocaleString()}">${timeAgo(comment.created_at)}</span>
                                        ${isCommentOwner ? '<a href="#" class="deleteCommentBtn">Delete</a>' : ''}
                                    </div>
                                    <div class="comment-body">${esc(comment.content)}</div>
                                </div>
                            </div>
                        `);
                    });
                },
                error: function(err) {
                    console.error('Error fetching comments:', err);
                }
            });
        }

        // Event handlers for picking a star rating in the comment form
        $('#postsContainer').on('click', '.rating-picker .star-btn', function() {
            const picker = $(this).closest('.rating-picker');
            const input = picker.closest('form').find('.commentRatingInput');
            const clicked = Number($(this).data('value'));
            const current = Number(input.val()) || 0;
            const next = current === clicked ? 0 : clicked; // clicking the active star clears it
            input.val(next || '');
            picker.find('.star-btn').each(function() {
                $(this).toggleClass('active', Number($(this).data('value')) <= next);
            });
        });
        $('#postsContainer').on('mouseenter', '.rating-picker .star-btn', function() {
            const hovered = Number($(this).data('value'));
            $(this).closest('.rating-picker').find('.star-btn').each(function() {
                $(this).toggleClass('hover', Number($(this).data('value')) <= hovered);
            });
        });
        $('#postsContainer').on('mouseleave', '.rating-picker', function() {
            $(this).find('.star-btn').removeClass('hover');
        });

        // Event handler for submitting a new comment
        $('#postsContainer').on('submit', '.commentForm', function(e) {
            e.preventDefault();
            const form = $(this);
            const postId = form.closest('.comments-section').data('post-id');
            const input = form.find('.commentInput');
            const ratingInput = form.find('.commentRatingInput');
            const content = input.val().trim();
            if (!content) return;

            const payload = { content };
            if (ratingInput.val()) payload.rating = Number(ratingInput.val());

            $.ajax({
                url: `/api/posts/${postId}/comments`,
                type: 'POST',
                contentType: 'application/json',
                headers: { 'Authorization': `Bearer ${token}` },
                data: JSON.stringify(payload),
                success: function() {
                    input.val('');
                    ratingInput.val('');
                    form.find('.star-btn').removeClass('active hover');
                    loadComments(postId);
                },
                error: function(err) {
                    console.error('Error posting comment:', err);
                }
            });
        });

        // Event handler for deleting a comment
        $('#postsContainer').on('click', '.deleteCommentBtn', function(e) {
            e.preventDefault();
            const commentEl = $(this).closest('[data-comment-id]');
            const postId = $(this).closest('.comments-section').data('post-id');
            const commentId = commentEl.data('comment-id');

            if (confirm('Are you sure you want to delete this comment?')) {
                $.ajax({
                    url: `/api/comments/${commentId}`,
                    type: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` },
                    success: function() {
                        loadComments(postId);
                    },
                    error: function(err) {
                        console.error('Error deleting comment:', err);
                    }
                });
            }
        });

        // ------------------------------------------------------------------
        // Edit post dialog
        // ------------------------------------------------------------------
        const edit = { postId: null, file: null, removeImage: false };

        function renderEditImage(src) {
            $('#editImagePreview').html(src ? `<img src="${esc(src)}" alt="">` : '<div class="no-image">No image</div>');
            $('#removeImageBtn').prop('hidden', !src);
        }

        function openEditDialog(post) {
            edit.postId = post.id;
            edit.file = null;
            edit.removeImage = false;
            $('#editTitle').val(post.title);
            $('#editContent').val(post.content);
            $('#editImageInput').val('');
            $('#editError').text('');
            renderEditImage(post.image_url);
            $('#editDialog').prop('hidden', false);
            $('#editTitle').trigger('focus');
        }

        function closeEditDialog() {
            $('#editDialog').prop('hidden', true);
            edit.postId = null;
        }

        // Re-render a single post in place after it was edited
        function refreshPost(postId) {
            $.get(`/api/posts/${postId}`, function(post) {
                const updated = $(postHtml(post)).addClass('just-updated');
                $(`.post-card[data-post-id="${postId}"]`).replaceWith(updated);
                loadComments(postId);
            });
        }

        $('#postsContainer').on('click', '.editBtn', function() {
            const postId = $(this).closest('.post-card').data('post-id');
            // Load the stored post instead of reading the (highlighted) text from the card
            $.get(`/api/posts/${postId}`, openEditDialog).fail(function(err) {
                console.error('Error loading post:', err);
            });
        });

        $('#editImageInput').on('change', function() {
            const file = this.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                $('#editError').text('Please choose an image file.');
                $(this).val('');
                return;
            }
            edit.file = file;
            edit.removeImage = false;
            $('#editError').text('');
            const reader = new FileReader();
            reader.onload = e => renderEditImage(e.target.result);
            reader.readAsDataURL(file);
        });

        $('#removeImageBtn').on('click', function() {
            edit.file = null;
            edit.removeImage = true;
            $('#editImageInput').val('');
            renderEditImage(null);
        });

        $('#cancelEditBtn').on('click', closeEditDialog);
        $('#editDialog').on('click', function(e) {
            if (e.target === this) closeEditDialog(); // click on the backdrop
        });
        $(document).on('keydown', function(e) {
            if (e.key === 'Escape' && !$('#editDialog').prop('hidden')) closeEditDialog();
        });

        $('#editPostForm').on('submit', function(e) {
            e.preventDefault();
            const postId = edit.postId;
            const formData = new FormData();
            formData.append('title', $('#editTitle').val());
            formData.append('content', $('#editContent').val());
            if (edit.file) formData.append('image', edit.file);
            else if (edit.removeImage) formData.append('remove_image', 'true');

            $('#saveEditBtn').prop('disabled', true).text('Saving...');
            $.ajax({
                url: `/api/posts/${postId}`,
                type: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` },
                data: formData,
                processData: false,
                contentType: false,
                success: function() {
                    closeEditDialog();
                    refreshPost(postId);
                },
                error: function(xhr) {
                    $('#editError').text(xhr.responseJSON?.message || 'Could not save the post.');
                },
                complete: function() {
                    $('#saveEditBtn').prop('disabled', false).text('Save changes');
                }
            });
        });

        // Event handler for Delete button
        $('#postsContainer').on('click', '.deleteBtn', function() {
            const card = $(this).closest('.post-card');
            const postId = card.data('post-id');
            if (confirm("Are you sure you want to delete this post?")) {
                $.ajax({
                    url: `/api/posts/${postId}`,
                    type: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` },
                    success: function() {
                        card.remove();
                        feed.offset--;
                        feed.total--;
                        if (feed.total === 0) $('#postsContainer').html(emptyStateHtml());
                        updateFeedFooter();
                    },
                    error: function(err) {
                        console.error('Error deleting post:', err);
                    }
                });
            }
        });
    });
</script>
</body>
</html>
