<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container">
    <h2 class="my-4">Create a New Post</h2>
    <form id="postForm">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea class="form-control" id="content" rows="5" required></textarea>
        </div>
        <div class="form-group">
            <label for="image">Image (optional)</label>
            <input type="file" class="form-control-file" id="image" accept="image/*">
            <img id="imagePreview" class="mt-2 img-fluid rounded" style="display:none; max-height:280px;">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="index.html" class="btn btn-link">Cancel</a>
    </form>
    <div id="postMessage" class="mt-3"></div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Preview the selected image before uploading
    $('#image').on('change', function() {
        const file = this.files[0];
        const preview = $('#imagePreview');
        if (!file) {
            preview.hide().attr('src', '');
            return;
        }
        const reader = new FileReader();
        reader.onload = e => preview.attr('src', e.target.result).show();
        reader.readAsDataURL(file);
    });

    $('#postForm').submit(function(e) {
        e.preventDefault();
        const token = localStorage.getItem('token');

        // Check if the user is logged in
        if (!token) {
            $('#postMessage').text('You need to log in to create a post.').removeClass('text-success').addClass('text-danger');
            return;
        }

        const formData = new FormData();
        formData.append('title', $('#title').val());
        formData.append('content', $('#content').val());
        const imageFile = $('#image')[0].files[0];
        if (imageFile) formData.append('image', imageFile);

        $.ajax({
            url: '/api/posts',
            type: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                $('#postMessage').text('Post created successfully! Redirecting...').removeClass('text-danger').addClass('text-success');

                // Redirect to index.html after successful post creation
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500); // Delay to show the success message
            },
            error: function(xhr) {
                const message = xhr.responseJSON?.message || xhr.statusText;
                $('#postMessage').text('Error creating post: ' + message).removeClass('text-success').addClass('text-danger');
                console.error('Error creating post:', message);
            }
        });
    });
</script>
</body>
</html>
