<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container">
    <h2 class="my-4">Forgot Password</h2>
    <p class="text-muted">Enter your username or email and we'll send you instructions to reset your password.</p>

    <!-- NOTE: Not functional yet. This is a UI placeholder; no request is sent to the backend. -->
    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="usernameOrEmail">Username or Email</label>
            <input type="text" class="form-control" id="usernameOrEmail" required>
        </div>
        <button type="submit" class="btn btn-primary">Send Reset Instructions</button>
        <a href="login.html" class="btn btn-link">Back to Login</a>
    </form>
    <div id="forgotPasswordMessage" class="mt-3"></div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Placeholder only: password recovery is not implemented on the backend yet.
    $('#forgotPasswordForm').submit(function(e) {
        e.preventDefault();
        $('#forgotPasswordMessage')
            .text('This feature is coming soon. Password recovery is not available yet.')
            .removeClass('text-danger')
            .addClass('text-info');
    });
</script>
</body>
</html>
